<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Davide Garassino — Game Designer</title>
  <meta name="description" content="Davide Garassino, game designer and producer. New portfolio coming soon.">
  <style>
    :root { --bg: #0f1115; --fg: #e8e9ec; --muted: #9aa0aa; --accent: #7cf29c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .25em; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0 0 1.5em; font-size: 1.1rem; }
    .role { color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .15em; font-size: .85rem; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a {
      color: var(--fg); text-decoration: none; padding: 10px 18px;
      border: 1px solid #2a2e36; border-radius: 8px;
    }
    a:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="role">Game Designer &amp; Producer</div>
    <h1>Davide Garassino</h1>
    <p>New portfolio coming soon.</p>
    <nav>
      <a href="https://davidegarassino.wordpress.com/">Current portfolio</a>
      <a href="https://dada199.itch.io/">itch.io</a>
      <a href="https://www.linkedin.com/in/davide-garassino-088a00276">LinkedIn</a>
      <a href="mailto:garassino.davide@outlook.it">Email</a>
    </nav>
  </main>
</body>
</html>
